# The probe as a web page, so that adding a machine to the catalogue is
# "open a link in Chrome, press a button, drop the file into an issue" — no
# install, no terminal.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only the probe and the landing page. Nothing else in this repository is
      # meant for a browser.
      - run: |
          mkdir -p _site
          cp index.html probe.html probe.js sw-probe.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
